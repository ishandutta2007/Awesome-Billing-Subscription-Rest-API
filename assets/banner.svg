<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="45" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      .animated-orb1 {
        animation: pulseOrb 8s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .animated-orb2 {
        animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
        transform-origin: 1000px 300px;
      }
      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
      .flowing-line {
        stroke-dasharray: 6 6;
        animation: dashFlow 2.5s linear infinite;
      }
      .font-sans {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)" />

  <!-- Animated Glowing Orbs (in background) -->
  <circle class="animated-orb1" cx="180" cy="90" r="140" fill="#38bdf8" filter="url(#glow-cyan)" opacity="0.35" />
  <circle class="animated-orb2" cx="1020" cy="330" r="160" fill="#a855f7" filter="url(#glow-purple)" opacity="0.3" />
  <circle cx="600" cy="210" r="180" fill="#6366f1" filter="url(#glow-purple)" opacity="0.15" />

  <!-- Cybernetic Grid Overlay -->
  <rect width="1200" height="420" fill="url(#cyber-grid)" />

  <!-- Flowing Network Lines in Background -->
  <path class="flowing-line" d="M 50 360 C 250 320, 350 380, 550 350 S 850 390, 1150 340" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
  <path class="flowing-line" d="M 50 80 C 300 120, 500 50, 750 90 S 1000 40, 1150 80" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Floating Ambient UI Card Left (Under Title Layer) -->
  <g class="floating-card-1" transform="translate(60, 240)">
    <rect width="220" height="110" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" filter="url(#card-shadow)" />
    <circle cx="28" cy="28" r="8" fill="#34d399" />
    <text x="46" y="32" fill="#94a3b8" class="font-mono" font-size="12" font-weight="600">POST /v1/subscriptions</text>
    <rect x="20" y="52" width="180" height="8" rx="4" fill="#334155" opacity="0.8" />
    <rect x="20" y="68" width="130" height="8" rx="4" fill="#38bdf8" opacity="0.7" />
    <text x="20" y="96" fill="#34d399" class="font-mono" font-size="11">HTTP 200 OK • 18ms</text>
  </g>

  <!-- Floating Ambient UI Card Right (Under Title Layer) -->
  <g class="floating-card-2" transform="translate(920, 70)">
    <rect width="220" height="110" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2" filter="url(#card-shadow)" />
    <circle cx="28" cy="28" r="8" fill="#38bdf8" />
    <text x="46" y="32" fill="#94a3b8" class="font-mono" font-size="12" font-weight="600">USAGE METERING</text>
    <path d="M 24 82 Q 60 45, 90 70 T 150 50 T 200 65" fill="none" stroke="#818cf8" stroke-width="2.5" />
    <text x="24" y="98" fill="#cbd5e1" class="font-mono" font-size="11">Events: 2,418,900 / mo</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(460, 48)">
    <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <text x="140" y="21" fill="#38bdf8" class="font-mono" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">⚡ CURATED DEVELOPER ECOSYSTEM</text>
  </g>

  <!-- MAIN FOREGROUND TITLE (Crisp, High Contrast, Guaranteed Foreground) -->
  <text x="600" y="145" class="font-sans" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-0.5">
    <tspan fill="#ffffff">Awesome </tspan>
    <tspan fill="url(#primary-grad)">Billing &amp; Subscription</tspan>
    <tspan fill="#ffffff"> APIs</tspan>
  </text>

  <!-- SUBTITLE -->
  <text x="600" y="195" fill="#94a3b8" class="font-sans" font-size="18" font-weight="500" text-anchor="middle" letter-spacing="0.2">
    The Ultimate Directory of REST APIs, Invoicing Engines, Usage Metering &amp; Payment Orchestration
  </text>

  <!-- FEATURE PILLS / TAGS (Center Foreground) -->
  <g transform="translate(240, 240)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="165" height="38" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <text x="82" y="24" fill="#e2e8f0" class="font-sans" font-size="13" font-weight="600" text-anchor="middle">💳 Recurring Billing</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(180, 0)">
      <rect width="175" height="38" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
      <text x="87" y="24" fill="#e2e8f0" class="font-sans" font-size="13" font-weight="600" text-anchor="middle">📊 Metered Usage APIs</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(370, 0)">
      <rect width="170" height="38" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
      <text x="85" y="24" fill="#e2e8f0" class="font-sans" font-size="13" font-weight="600" text-anchor="middle">🛡️ Merchant of Record</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(555, 0)">
      <rect width="165" height="38" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.2" />
      <text x="82" y="24" fill="#e2e8f0" class="font-sans" font-size="13" font-weight="600" text-anchor="middle">⚡ Self-Hosted OSS</text>
    </g>
  </g>

  <!-- Tech Stats Badge Footer Line -->
  <g transform="translate(350, 320)">
    <rect width="500" height="42" rx="21" fill="#111827" stroke="#334155" stroke-width="1" />
    <text x="250" y="26" fill="#cbd5e1" class="font-mono" font-size="12" text-anchor="middle">
      <tspan fill="#38bdf8" font-weight="700">10+ Top SaaS</tspan> • 
      <tspan fill="#34d399" font-weight="700">12+ Open-Source Engines</tspan> • 
      <tspan fill="#c084fc" font-weight="700">REST &amp; GraphQL</tspan>
    </text>
  </g>
</svg>